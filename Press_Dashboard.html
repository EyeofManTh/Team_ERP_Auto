<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>성우비나 Press 월간 생산성 보고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: dark left menu (3 groups × sub-pages) + bright content. Every page = Excel-style table first, trend charts below. */
:root{
  --bg:#F0F3F9; --card:#FFFFFF; --card-2:#F5F8FD; --line:#DAE1EE; --line-2:#BFCADD;
  --hdr:#E6EDF8; --zebra:#F8FAFD; --tot:#EAF1FC; --sel:#DCEAFD; --flag:#FFF4CC;
  --tx:#0F1B33; --tx2:#43506D; --tx3:#66738F;
  --accent:#2A78D6; --accent-2:#D9602A; --prev:#8C99B8; --bad:#C93232; --good:#0C7F30;
  --y2023:#7A62D6; --y2024:#12907F; --y2025:#B97800; --y2026:#2A78D6;
  --c1:#2A78D6; --c2:#D9602A; --c3:#12907F; --c4:#B97800; --c5:#C2477D; --c6:#5E7A1F;
  --side-a:#414B66; --side-b:#313A52; --s-tx:#EAF0FF; --s-tx2:#B3C0DD; --s-line:rgba(205,220,255,.16);
  --pill-a:#4B7BDB; --pill-b:#2F98A8;
  --f-d:'Sora','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  --f-b:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.55 var(--f-b);overflow-x:hidden}
button,a{font:inherit;color:inherit}
a{text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}

/* sidebar (dark) */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:22px 14px 16px;background:linear-gradient(180deg,var(--side-a),var(--side-b));color:var(--s-tx)}
.brand{display:flex;align-items:center;gap:14px;padding:0 8px 14px}
.mark{display:grid;place-items:center;flex:none;width:50px;height:50px;border-radius:15px;font:700 21px var(--f-d);color:#fff;background:linear-gradient(135deg,#4B7BDB,#2F98A8);box-shadow:0 8px 22px rgba(47,152,168,.35);border:1px solid rgba(255,255,255,.22)}
.brand-n{font:700 20px/1.1 var(--f-d);letter-spacing:.07em;color:#fff}
.brand-s{margin-top:5px;font:600 11px/1.3 var(--f-d);letter-spacing:.16em;color:var(--s-tx2)}
.nav{display:flex;flex-direction:column;gap:2px}
.ng{margin:16px 10px 5px;font-size:12.5px;font-weight:700;color:var(--s-tx2)}
.nv{display:flex;align-items:center;gap:13px;min-height:42px;padding:0 14px;border-radius:12px;border:1px solid transparent;font-size:14.5px;font-weight:600;color:var(--s-tx);cursor:pointer}
.nv svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
@media (max-height:960px){.nv{min-height:38px}.ng{margin-top:10px}.side{padding-top:16px}.brand{padding-bottom:6px}}
.nv:hover{background:rgba(255,255,255,.08)}
.nv[aria-current="page"]{color:#fff;background:linear-gradient(90deg,var(--pill-a),var(--pill-b));border-color:rgba(255,255,255,.24);box-shadow:0 8px 20px rgba(47,152,168,.30)}
.side-f{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--s-line);display:flex;flex-direction:column;gap:10px}
.asof{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--s-tx2)}.asof b{color:#fff}
.pulse{width:8px;height:8px;border-radius:50%;background:#5BD38A;animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(91,211,138,.55)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.sf-b{display:flex;gap:8px}
.ibtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:11px;border:1px solid var(--s-line);background:rgba(255,255,255,.07);color:var(--s-tx);cursor:pointer;font-size:13.5px;font-weight:500}
.ibtn:hover{border-color:#8FB4F5}
.ibtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.web{font-size:12.5px;color:var(--s-tx2)}
.mtop{display:none;position:sticky;top:0;z-index:30;align-items:center;gap:12px;padding:10px 16px;background:var(--side-b);color:#fff}
.mtop .ibtn{flex:none;width:42px;padding:0}.mtop b{font:700 16px var(--f-d);letter-spacing:.06em}
.back{display:none}

/* content */
.main{min-width:0;padding:28px clamp(16px,2.6vw,40px) 64px;max-width:1400px;width:100%}
.ph{margin-bottom:18px}
.eyebrow{font:600 12.5px var(--f-d);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{margin:6px 0 0;font:600 clamp(24px,2.8vw,32px)/1.2 var(--f-d);letter-spacing:-.018em;text-wrap:balance}
.sub1{margin:8px 0 0;max-width:86ch;font-size:15.5px;color:var(--tx2)}
.sub1 b{color:var(--tx)}
.hc{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.kc{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:13.5px;color:var(--tx2)}
.kc b{font:600 15px var(--f-d);color:var(--tx)}
.dl{font:600 13px var(--f-d)}
.up{color:var(--good)}.dn{color:var(--bad)}.nt{color:var(--accent)}
.seg{display:inline-flex;padding:3px;border-radius:10px;border:1px solid var(--line-2);background:var(--card)}
.seg button{white-space:nowrap;border:0;background:transparent;padding:6px 13px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--tx2);cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:linear-gradient(90deg,var(--pill-a),var(--pill-b));color:#fff}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* excel-style table card */
.xl{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(15,27,51,.04)}
.xl+.xl,.xl+.grid2,.grid2+.xl,.grid2+.grid2,.xl+.card{margin-top:16px}
.xl-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff,#F6F9FD)}
.xl-h h3{margin:0;font:700 15.5px/1.35 var(--f-d)}
.xl-s{margin-top:2px;font-size:13px;color:var(--tx3)}
.xl-w{overflow:auto}
.xl-w.tall{max-height:440px}
table.x{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
table.x th{background:var(--hdr);color:var(--tx);font-weight:700;font-size:13px;text-align:center;white-space:nowrap;padding:9px 12px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line)}
table.x.st th{position:sticky;top:0;z-index:2}
table.x th:last-child,table.x td:last-child{border-right:0}
table.x td{padding:8px 12px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);border-right:1px solid var(--line);background-color:var(--card)}
table.x tbody tr:nth-child(even) td{background-color:var(--zebra)}
table.x td.l{text-align:left}table.x td.c{text-align:center}
table.x td.k{font-weight:700;text-align:left}
table.x tr.tot td{background-color:var(--tot);font-weight:700}
table.x tr.flag td{background-color:var(--flag)}
table.x tr.clk{cursor:pointer}
table.x tr.clk:hover td{background-color:#EEF4FD}
table.x tr.sel td{background-color:var(--sel)}
table.x tr.sel td.k{box-shadow:inset 3px 0 0 var(--accent)}
table.x tbody tr:last-child td{border-bottom:0}
@media (max-width:1560px) and (min-width:961px){table.x th{padding:9px 8px;font-size:12.5px}table.x td{padding:8px 8px}}
.xl-n{padding:10px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--tx3);background:#FAFBFE}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;font:600 12px var(--f-d);background:#FFE9A8;color:#6B4B00}

/* charts */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid2.w{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.xl+.grid3{margin-top:16px}
table.x.cmp td{padding:6px 8px}
table.x td.hl{background-color:#E3F4F0!important;text-align:center}
.mu{font:700 17px var(--f-d);color:#0B6F63}
table.x th small{font-weight:500;color:var(--tx3);font-size:12px}
.card{min-width:0;padding:18px 20px;border-radius:14px;border:1px solid var(--line);background:var(--card);box-shadow:0 1px 2px rgba(15,27,51,.04)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.card-h h3{margin:0;font:700 15.5px/1.35 var(--f-d)}
.sub{font-size:13px;color:var(--tx3);margin-top:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--tx2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:16px;height:4px;border-radius:2px}
.legend i.sw{height:12px;width:12px;border-radius:3px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.tk{font:400 12.5px var(--f-b);fill:var(--tx3)}
.tk2{font:500 13px var(--f-b);fill:var(--tx2)}
.vl{font:600 13px var(--f-d);fill:var(--tx)}
.vl2{font:500 12px var(--f-d);fill:var(--tx2)}
.wl{font:600 12px var(--f-d);fill:#fff}
.sech{margin:26px 0 10px;font:700 17px var(--f-d)}
.hint{font-size:13px;color:var(--tx3)}
.basis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.basis div{padding:16px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.basis h4{margin:0 0 6px;font:700 15px var(--f-d)}
.basis p{margin:0;font-size:14px;color:var(--tx2)}
#tip{position:fixed;z-index:60;pointer-events:none;min-width:150px;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:#fff;box-shadow:0 10px 28px rgba(15,27,51,.18);font-size:13px}
#tip .tt{font:700 13px var(--f-d);margin-bottom:5px}
#tip .tr{display:flex;align-items:center;gap:8px;line-height:1.7;color:var(--tx2)}
#tip .tr i{width:12px;height:3px;border-radius:2px;flex:none}
#tip .tr b{color:var(--tx);font:600 14px var(--f-d);min-width:54px}
.empty{padding:28px;text-align:center;color:var(--tx3)}

@media (max-width:1100px){.grid2,.grid2.w,.grid3{grid-template-columns:1fr}}
@media (max-width:960px){
  .app{grid-template-columns:1fr}.mtop{display:flex}
  .side{position:fixed;z-index:50;left:0;top:0;bottom:0;width:284px;transform:translateX(-102%);transition:transform .22s ease;box-shadow:16px 0 40px rgba(0,0,0,.35)}
  .side.open{transform:none}
  .back.on{display:block;position:fixed;inset:0;z-index:40;background:rgba(5,10,25,.5)}
  .basis{grid-template-columns:1fr}.main{padding-top:20px}
}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.side{transition:none}}
@media print{
  @page{size:A4 landscape;margin:8mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .side,.mtop,.back,.seg,#tip{display:none!important}
  .app{display:block}.xl-w.tall{max-height:none}.xl,.card{break-inside:avoid}.main{padding:0}
}
</style>
</head>

</div>

  const X=v=>pl+v/mx*(w-pl-pr);const svg=el('svg',{viewBox:`0 0 ${w} ${h}`,height:h,role:'img','aria-label':'구성'},host);
  const ticks=pct?[0,25,50,75,100]:nice(0,mx,4).ticks;
  ticks.forEach(v=>{el('line',{x1:X(v),x2:X(v),y1:6,y2:h-24,style:'stroke:var(--line);stroke-width:1'},svg);tx(svg,X(v),h-6,pct?v+'%':fmt(v,0),'tk','middle');});
  rows.forEach((r,i)=>{const y=10+i*rowH,bh=Math.min(24,rowH-12);tx(svg,pl-12,y+bh/2+4.5,r.label,'tk2','end');let cum=0;const segs=r.segs.filter(s=>s.v>0);
    segs.forEach((s,k)=>{const x1=X(cum),x2=X(cum+s.v),gap=k===0?0:1;const wd=Math.max(x2-x1-gap,1.5);
      const isLast=k===segs.length-1;const rect=(isLast?hbar(svg,x1+gap,y,wd,bh,4,s.color):el('rect',{x:x1+gap,y,width:wd,height:bh,style:`fill:${s.color}`},svg));
      if(wd>=46&&s.v/(pct?100:mx)>=.07)tx(svg,x1+gap+wd/2,y+bh/2+4.5,pct?fmt(s.v,1)+'%':fmt(s.v,dec),'wl','middle');
      const hit=el('rect',{x:x1,y:y-2,width:Math.max(x2-x1,6),height:bh+4,style:'fill:transparent'},svg);
      hit.addEventListener('pointermove',e=>showTip(e.clientX,e.clientY,r.label,[{color:s.color,value:(pct?fmt(s.v,1)+'%':fmt(s.v,dec)+unit),label:s.n}].concat(s.tip||[])));hit.addEventListener('pointerleave',hideTip);cum+=s.v;});
    if(showTot)tx(svg,X(cum)+8,y+bh/2+4.5,fmtTot?fmtTot(cum,r):fmt(cum,dec),'vl2','start');});
}

/* ── single series columns (monthly) ── */
function singleCols(host,{vals,labels,dec=1,unit='',tipFn,color='var(--accent)'}){host.textContent='';
  const w=Math.max(280,host.clientWidth),h=290,m={l:44,r:10,t:26,b:30},n=vals.length;
  const sc=nice(0,Math.max(1,...vals.filter(v=>v!=null))*1.12,4);const Y=v=>m.t+(sc.hi-v)/(sc.hi-sc.lo)*(h-m.t-m.b);
  const band=(w-m.l-m.r)/n,bw=Math.min(24,band*.58);
  const svg=el('svg',{viewBox:`0 0 ${w} ${h}`,height:h,role:'img','aria-label':'월별 추이'},host);
  sc.ticks.forEach(v=>{el('line',{x1:m.l,x2:w-m.r,y1:Y(v),y2:Y(v),style:'stroke:var(--line);stroke-width:1'},svg);tx(svg,m.l-8,Y(v)+4.5,v.toFixed(tdec(sc.step)),'tk','end');});
  const mi=vals.indexOf(Math.max(...vals));
  vals.forEach((v,i)=>{const cx=m.l+band*(i+.5),isL=i===n-1;if(v==null)return;const top=Y(v);
    const b=vbar(svg,cx-bw/2,top,bw,Y(0)-top,4,color,{style:`fill:${color};opacity:${isL?1:.7};transition:opacity .15s`});
    if(isL||i===mi||i===0||band>=46)tx(svg,cx,top-8,fmt(v,dec)+unit,isL?'vl':'vl2','middle');tx(svg,cx,h-8,band<30&&i%2?'':labels[i],'tk','middle');
    const hit=el('rect',{x:cx-band/2,y:m.t,width:band,height:h-m.t-m.b,style:'fill:transparent'},svg);
    hit.addEventListener('pointermove',e=>{b.style.opacity=1;showTip(e.clientX,e.clientY,labels[i],tipFn(i,v));});hit.addEventListener('pointerleave',()=>{b.style.opacity=isL?1:.7;hideTip();});});
}
/* ── stacked columns ── */
function stackCols(host,{cols,max,tipFn,topLabel,height}){host.textContent='';
  const w=Math.max(280,host.clientWidth),h=height||290,m={l:44,r:10,t:26,b:30},n=cols.length;
  const sc=max?{lo:0,hi:max,ticks:[0,25,50,75,100].map(v=>v*max/100),step:max/4}:nice(0,Math.max(1,...cols.map(c=>c.segs.reduce((a,s)=>a+s.v,0)))*1.12,4);
  const Y=v=>m.t+(sc.hi-v)/(sc.hi-sc.lo)*(h-m.t-m.b);const band=(w-m.l-m.r)/n,bw=Math.min(24,band*.6);
  const svg=el('svg',{viewBox:`0 0 ${w} ${h}`,height:h,role:'img','aria-label':'월별 구성'},host);
  sc.ticks.forEach(v=>{el('line',{x1:m.l,x2:w-m.r,y1:Y(v),y2:Y(v),style:'stroke:var(--line);stroke-width:1'},svg);tx(svg,m.l-8,Y(v)+4.5,v.toFixed(tdec(sc.step)),'tk','end');});
  cols.forEach((c,i)=>{const cx=m.l+band*(i+.5),x=cx-bw/2;let cum=0;const segs=c.segs.filter(s=>s.v>0);
    segs.forEach((s,k)=>{const y1=Y(cum+s.v),y2=Y(cum),top=k===segs.length-1;const gt=top?0:1,gb=k===0?0:1;const hh=Math.max(y2-y1-gt-gb,1.5);
      if(top)vbar(svg,x,y1,bw,hh,4,s.color);else el('rect',{x,y:y1+gt,width:bw,height:hh,style:`fill:${s.color}`},svg);cum+=s.v;});
    const tl=topLabel?topLabel(c,i):null;if(tl&&(band>=34||i===n-1||i===0))tx(svg,cx,Y(cum)-8,tl,'vl2','middle');tx(svg,cx,h-8,band<30&&i%2?'':c.label,'tk','middle');
    const hit=el('rect',{x:cx-band/2,y:m.t,width:band,height:h-m.t-m.b,style:'fill:transparent'},svg);
    hit.addEventListener('pointermove',e=>{const t=tipFn(c);showTip(e.clientX,e.clientY,t.t,t.rows);});hit.addEventListener('pointerleave',hideTip);});
}

/* ── excel-style table helpers ── */
const c_=(t,cls,st)=>`<td${cls?` class="${cls}"`:''}${st?` style="${st}"`:''}>${t}</td>`;
const bar=(v,max)=>`background-image:linear-gradient(90deg,rgba(42,120,214,.20) ${Math.max(0,Math.min(100,v/max*100)).toFixed(1)}%,transparent ${Math.max(0,Math.min(100,v/max*100)).toFixed(1)}%)`;
const dcell=(d,txt,good)=>d==null?'–':`<span class="dl ${Math.abs(d)<.05?'nt':good?'up':'dn'}">${Math.abs(d)<.05?'':d>0?'▲ ':'▼ '}${txt}</span>`;
function xl({title,sub,ctl,head,rows,cls='',tall=false,note,foot}){
  return`<div class="xl"><div class="xl-h"><div><h3>${title}</h3>${sub?`<div class="xl-s">${sub}</div>`:''}</div>${ctl?`<div class="ctl">${ctl}</div>`:''}</div>
  <div class="xl-w${tall?' tall':''}"><table class="x ${cls}"><thead>${head}</thead><tbody>${rows}</tbody></table></div>${note?`<div class="xl-n">${note}</div>`:''}</div>`;}
const th=(t,a='')=>`<th ${a}>${t}</th>`;
const chartCard=(id,title,sub,legend)=>`<div class="card"><div class="card-h"><div><h3>${title}</h3>${sub?`<div class="sub">${sub}</div>`:''}</div>${legend?`<div class="legend">${legend}</div>`:''}</div><div class="chart" id="${id}"></div></div>`;
const segHTML=(id,items,cur)=>`<div class="seg" id="${id}" role="group">${items.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${String(cur)===String(v)}">${l}</button>`).join('')}</div>`;
const kchip=(l,v,d)=>`<span class="kc">${l}<b>${v}</b>${d||''}</span>`;
function pageHead(eyebrow,title,sub,chips,ctl){return`<header class="ph"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1></div>${ctl?`<div class="ctl">${ctl}</div>`:''}</div><p class="sub1">${sub}</p>${chips?`<div class="hc">${chips}</div>`:''}</header>`;}

/* ═════════ PAGE: 무세정 ═════════ */
function pMuse(){
  const c=UI.cat,n=NAME(c);const tot=muse(1,LM,c),mon=Array.from({length:LM},(_,i)=>muse(i+1,i+1,c));
  const last=mon[LM-1].ratio||0,prev=LM>1?(mon[LM-2].ratio||0):null,first=mon[0].ratio||0;
  const sub=c!==ALL&&tot.u===0?`<b>${n}</b>은 무세정 대상이 아닙니다. 무세정은 일관과 범용에서만 진행됩니다.`:`<b>${n}</b> 무세정 비율 ${LY}.01–${String(LM).padStart(2,'0')} 누계 <b>${fmt(tot.ratio||0)}%</b>(${fmt(tot.u/1e6)}M EA). 1월 ${fmt(first)}%에서 ${LM}월 ${fmt(last)}%로 <b>${sgn(dpp(last,first),1,'%p')}</b> 늘었습니다. 무세정 공정은 ${LY}년에 도입돼 올해만 집계합니다.`;
  const chips=kchip('누계 무세정 비율',fmt(tot.ratio||0)+'%')+kchip(`${LM}월`,fmt(last)+'%',dcell(prev==null?null:dpp(last,prev),sgn(dpp(last,prev),1,'%p')+' 전월',true))+kchip('1월 대비',sgn(dpp(last,first),1,'%p'));
  const mode=UI.museMode;
  const head=`<tr>${th('제품군')}${MO.map(m=>th(m)).join('')}${th(`1~${LM}월 누계`)}${th('무세정 수량(EA)')}${th('양품 수량(EA)')}</tr>`;

/* ═════════ PAGE: 다 cavity 효과 ═════════ */
function effG(c){const a=S(LY,1,LM,c),b=S(PY,1,LM,c);if(!a.t||!b.t||!a.s||!b.s)return null;
  const spm6=a.s/a.t,spm5=b.s/b.t,ea6=a.q/a.t,ea5=b.q/b.t,ec6=a.q/a.s,ec5=b.q/b.s,spmR=spm6/spm5,cavR=ec6/ec5;
  return{a,b,spm6,spm5,ea6,ea5,ec6,ec5,spmR,cavR,speed:ea5*(spmR-1),cav:ea5*spmR*(cavR-1),mix:0,hrs:(()=>{let h=0;for(let m=1;m<=LM;m++){const o=S(LY,m,m,c);if(o.t&&o.s)h+=o.t*((o.q/o.s)/ec5-1)/60;}return h;})(),sh6:cavO(LY,1,LM,c).share,sh5:cavO(PY,1,LM,c).share};}
function effAll(){const T6=S(LY,1,LM,ALL),T5=S(PY,1,LM,ALL);
  const ea5=T5.q/T5.t,ea6=T6.q/T6.t,spm5=T5.s/T5.t,spm6=T6.s/T6.t,ec5=T5.q/T5.s,ec6=T6.q/T6.s;
  let speed=0,cav=0,hrs=0;
  SHOW.forEach(c=>{const g=effG(c);if(!g)return;const w=g.a.t/T6.t;speed+=w*g.speed;cav+=w*g.cav;hrs+=g.hrs;});
  return{a:T6,b:T5,spm6,spm5,ea6,ea5,ec6,ec5,spmR:spm6/spm5,cavR:ec6/ec5,speed,cav,mix:(ea6-ea5)-speed-cav,hrs,sh6:cavO(LY,1,LM,ALL).share,sh5:cavO(PY,1,LM,ALL).share};}
const effOf=c=>c===ALL?effAll():effG(c);

function gCmp(g){const ys=[...new Set(gMon(g).map(r=>r.y))].sort();const out=[];ys.forEach(y=>{const p=gPer(g,y,LM);if(p)out.push({y,...p});});return out;}

function dGMon(g){
  const X=F[GN[g]];const labels=X.mon.map(r=>`${String(r.y).slice(2)}.${String(r.m).padStart(2,'0')}`);
  lineChart($('#gM1'),{labels,series:[{name:'다 cavity 비중',color:'var(--c1)',vals:X.mon.map(r=>((r.r2||0)+(r.r4||0))*100)}],dec:1,unit:'%',floor0:true,aria:'월별 다cavity 비중'});
  lineChart($('#gM2'),{labels,series:[{name:'SPM (Stroke/분)',color:'var(--c1)',vals:X.mon.map(r=>r.spmS)},{name:'SPM (EA/분)',color:'var(--c2)',vals:X.mon.map(r=>r.spmE)}],dec:1,aria:'월별 SPM'});
}

function pInfo(){
  const B=[['모수','법인 ERP Press 양품 실적(2023~'+LY+'.'+String(LM).padStart(2,'0')+'). Press Charge · Press auto charge, Assy No GH61/63/64/98 + -SP1 기준이며 DECO는 3개 품목만 포함합니다.'],
    ['SPM (Stroke/분)','Σ(양품 ÷ Cavity) ÷ 가동시간(분). ST(초/Stroke) = 60 ÷ SPM. 불량은 수량에서 빼고 가동시간은 반영합니다. SPM 600 초과 또는 5 미만 13건은 제외했습니다.'],
    ['SPM (EA/분)','양품 EA ÷ 가동시간(분). Cavity로 나누지 않아 실제 생산 속도를 보여줍니다. 다 cavity 전환 효과는 이 값으로 확인합니다.'],
    ['다 cavity 비중','2·4 cavity 코드(146개)의 양품 비중입니다. 다 Cavity List Rev 2 기준이며 목록에 없는 코드는 1 cavity로 계산합니다.'],
    ['무세정','세정(SC1) 실적이 없는 코드의 양품 비중입니다. ' + LY + '년에 도입돼 올해만 있고, 범용(60톤 제외)은 6월부터 집계합니다.'],
    ['동기 비교','연도 비교는 모두 같은 달(1~'+LM+'월) 기준입니다. 연도별 요약 표의 이전 연도는 연간 값이라 동기 비교 표를 함께 제공합니다.'],
    ['제품군','일관은 Press auto charge 전체입니다. REAR만 있는 3개 코드(REAR 미지정)는 기타에 포함합니다.'],
    ['다 cavity 효과','평균 cavity = 양품 EA ÷ Stroke 수, SPM(EA) = SPM(Stroke) × 평균 cavity입니다. 월간 요약의 ‘다 cavity 효과’는 전년 동기 대비 SPM(EA) 증가(%) 중 평균 cavity 상승으로 설명되는 몫(%p)이며, 나머지는 Stroke 속도 변화와 (전체의) 제품 믹스 변화입니다.'],
    ['자료 출처','일관 · INNER WALL Press 캐비티별 생산비율 및 SPM 분석 (자료 활용) 엑셀, 법인 Press 품목구분별 월별 SPM 분석 데이터.']];
  return pageHead('공통','집계 기준','대시보드 수치의 산출 방식과 자료 출처입니다.')+`<div class="basis">${B.map(([h,p])=>`<div><h4>${h}</h4><p>${p}</p></div>`).join('')}</div>`;
}

/* ═════════ routing ═════════ */
const IC={
  zap:'<path d="M13 3L5 13.5h6L10 21l8-10.5h-6L13 3z"/>',
  grid:'<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>',
  gauge:'<path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/><circle cx="12" cy="17" r="1"/>',
  drop:'<path d="M12 3.5s6 6.4 6 10.8a6 6 0 0 1-12 0C6 9.9 12 3.5 12 3.5z"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  trend:'<path d="M3 17l5-6 4 3 8-9"/><path d="M15 5h5v5"/>',
  press:'<rect x="5" y="3.5" width="14" height="5" rx="1.5"/><path d="M12 8.5v6"/><rect x="8" y="14.5" width="8" height="5" rx="1.2"/>',
  list:'<path d="M5 6h14M5 12h14M5 18h9"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'};
const NAV=[
  {g:'Press 종합 현황',items:[['sum','월간 요약','grid',pSum,dSum],['spm','SPM · ST','gauge',pSpm,dSpm],['muse','무세정','drop',pMuse,dMuse],['cav','Cavity 비율','layers',pCav,dCav]]},
  {g:'일관 Press 분석',items:[['i-yr','연도별 요약','cal',()=>pGYr('i'),()=>dGYr('i')],['i-mo','월별 추이','trend',()=>pGMon('i'),()=>dGMon('i')]]},
  {g:'INNER WALL 분석',items:[['w-yr','연도별 요약','cal',()=>pGYr('w'),()=>dGYr('w')],['w-mo','월별 추이','trend',()=>pGMon('w'),()=>dGMon('w')]]}];
const PAGES={};NAV.forEach(g=>g.items.forEach(([id,t,ic,p,d])=>PAGES[id]={p,d}));PAGES.info={p:pInfo,d:()=>{}};
function buildNav(){$('#nav').innerHTML=NAV.map(g=>`<div class="ng">${g.g}</div>`+g.items.map(([id,t,ic])=>`<a class="nv" href="#${id}" data-v="${id}"><svg viewBox="0 0 24 24">${IC[ic]}</svg>${t}</a>`).join('')).join('')+`<div class="ng">공통</div><a class="nv" href="#info" data-v="info"><svg viewBox="0 0 24 24">${IC.info}</svg>집계 기준</a>`;}
let cur='sum';
function render(keepScroll){const pg=PAGES[cur]||PAGES.sum;const y=window.scrollY;hideTip();$('#page').innerHTML=pg.p();bind();try{pg.d();}catch(e){console.error(e);}if(keepScroll)window.scrollTo(0,y);}
function bind(){
  const P=$('#page');
  P.querySelectorAll('tr[data-cat]').forEach(tr=>tr.addEventListener('click',()=>{UI.cat=+tr.dataset.cat;render(true);}));
  const seg=(id,key,num)=>{P.querySelectorAll(`#${id} button`).forEach(b=>b.addEventListener('click',()=>{UI[key]=num?+b.dataset.v:b.dataset.v;render(true);}));};
  seg('segMetric','metric');seg('segSpmYear','spmYear',1);seg('segSpmMode','spmMode');seg('segMuseMode','museMode');seg('segCavYear','cavYear',1);seg('segCavMode','cavMode');seg('segGMonYear','gMonYear');
  P.querySelectorAll('#segGMonYear button').forEach(b=>b.addEventListener('click',()=>{UI.gMonYear=b.dataset.v==='all'?'all':+b.dataset.v;render(true);},{once:false}));
}
function route(){const id=(location.hash||'#sum').slice(1);cur=PAGES[id]?id:'sum';
  document.querySelectorAll('.nv').forEach(a=>{if(a.dataset.v===cur)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  closeMenu();window.scrollTo(0,0);render(false);}
function closeMenu(){$('#side').classList.remove('open');$('#back').classList.remove('on');}
$('#btnMenu').addEventListener('click',()=>{$('#side').classList.add('open');$('#back').classList.add('on');});
$('#back').addEventListener('click',closeMenu);
window.addEventListener('hashchange',route);
$('#btnPrint').addEventListener('click',()=>{try{window.print();}catch(e){}});
$('#asof').textContent=`${LY}.${String(LM).padStart(2,'0')}`;
buildNav();computeKeys();route();
let lastW=0;new ResizeObserver(()=>{const w=$('.main').clientWidth;if(Math.abs(w-lastW)<2)return;lastW=w;render(true);}).observe($('.main'));
window.addEventListener('beforeprint',()=>render(true));
</script>
</body>
